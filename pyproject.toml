[project]
name = "basic-socket-rpc"
version = "0.6.1"
description = "Basic binary socket based rpc for Python"
readme = "README.md"
license = "MIT-0"
classifiers = [
   "License :: OSI Approved :: MIT No Attribution License (MIT-0)",
]
license-files = [
"LICENSE",
]
authors = [
    { name = "Gregory.Kuhn", email = "gregory.kuhn@analog.com" }
]
requires-python = ">=3.8"
dependencies = []


[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "pytest>=7.0.1",
]
[project.urls]
Repository = "https://github.com/mentaal/basic_rpc"
